name: Build Listening Practice Audio

on:
  push:
    paths:
      - 'listening-practice/**'
      - '.github/workflows/build-listening-practice-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Generate listening practice MP3 files
        run: |
          mkdir -p audio/listening-practice
          for n in 01 02 03 04 05 06 07 08 09 10; do
            edge-tts --voice en-US-GuyNeural --rate=-5% --file "listening-practice/exercise-$n.txt" --write-media "audio/listening-practice/exercise-$n.mp3"
          done

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/listening-practice
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
          else
            git commit -m "Generate Listening Practice audio"
            git push
          fi
